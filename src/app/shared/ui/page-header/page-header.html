@if (yoyo(); as pose) {
  <ye-yoyo [pose]="pose" [size]="88" />
}
<div class="text">
  @if (crumbs().length) {
    <nav aria-label="Estás en">
      <ol class="crumbs" role="list">
        @for (crumb of crumbs(); track crumb.label; let last = $last) {
          <li>
            @if (crumb.link && !last) {
              <a [routerLink]="crumb.link">{{ crumb.label }}</a>
            } @else {
              <span [attr.aria-current]="last ? 'page' : null">{{ crumb.label }}</span>
            }
            @if (!last) {
              <span class="sep" aria-hidden="true">›</span>
            }
          </li>
        }
      </ol>
    </nav>
  }
  <h1>{{ heading() }}</h1>
  @if (subtitle()) {
    <p class="subtitle">{{ subtitle() }}</p>
  }
</div>
<div class="aside">
  <ng-content select="[headerAside]" />
</div>
